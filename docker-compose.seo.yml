# SEOAgents 外挂服务群 (L4 重型非对称服务)
# 手册勘误: seonaut 官方镜像为 stjudewashere/seonaut (手册中拼写多了 "re"),
# 且必须搭配独立 MySQL 服务; openserp 默认端口为 7000 而非 7070。
services:
  openserp:
    image: karust/openserp:latest
    command: serve -a 0.0.0.0 -p 7000
    ports:
      - "7000:7000"
    restart: unless-stopped

  seonaut-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=seonaut
      - MYSQL_USER=seonaut
      - MYSQL_PASSWORD=seonaut_pass
      - MYSQL_ROOT_PASSWORD=seonaut_root_pass
    volumes:
      - seonaut_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pseonaut_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  seonaut:
    image: stjudewashere/seonaut:latest
    depends_on:
      seonaut-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - SEONAUT_DB_HOST=seonaut-db
      - SEONAUT_DB_USER=seonaut
      - SEONAUT_DB_PASS=seonaut_pass
      - SEONAUT_DB_NAME=seonaut
    restart: unless-stopped

volumes:
  seonaut_mysql:
