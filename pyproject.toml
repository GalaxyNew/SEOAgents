[project]
name = "seoagents"
version = "0.1.0"
description = "SEOAgents: self-evolving SEO/AEO agent cluster built on the DojoAgents seven-layer architecture"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "SEOAgents Team" }]

# Core runtime dependencies (L2-L7). Heavy / provider-specific packages live in extras
# so the project boots in keyless mock mode with a slim install.
dependencies = [
    "fastapi>=0.110.0,<0.112",
    "uvicorn>=0.31.1,<0.33",
    "pydantic>=2.6.0,<3",
    "pandas>=2.2.0,<3",
    "pyarrow>=14.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "portalocker>=2.8.2",
    "boto3>=1.34",
    "apscheduler>=3.10.0,<4",
    "scikit-learn>=1.4.0",
    "beautifulsoup4>=4.12.3",
    "jinja2>=3.1.3",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# Google Search Console / PageSpeed real-API mode
google = [
    "google-api-python-client>=2.110.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]
# Google Trends real-API mode
trends = ["pytrends>=4.9.2"]
# Model Context Protocol mounting (dataseo-mcp etc.)
mcp = ["mcp>=1.2.0,<2"]
# Semantic interlinking upgrade (TF-IDF -> embeddings)
semantic = ["sentence-transformers>=2.5.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
all = ["seoagents[google,trends,mcp]"]

[project.scripts]
seoagents-mcp = "seoagents.mcp_server:main"
seoagents = "seoagents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seoagents*", "dojocore*"]

[tool.setuptools.package-data]
seoagents = [
    "workflows/*.yaml",
    "skills/built_in/*.yaml",
    "dashboard/static/*.html",
    "dashboard/web/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# datetime.UTC is 3.11+; keep timezone.utc so the package also imports on 3.10
ignore = ["UP017", "UP041"]
