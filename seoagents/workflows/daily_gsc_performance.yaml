# Google 搜索表现 — 每日生产工作流
# 调度时间不写在模板内：Hermes Cron 是唯一时钟；Timeline 只记录计划与轨迹。
id: daily_gsc_performance
name: 每日 Google 搜索表现
version: "1.1"
dept: seo
description: 严格使用第一方 GSC，依次采集、标准化、证据归档、持久化并回读验收
tags: [gsc, search-console, daily, control-tower, production]

nodes:
  - id: input
    type: input
    title: 站点与业务日期
    depends_on: []
    acceptance: []
    config:
      input_mode: direct

  - id: collect_gsc
    type: tool_call
    title: 探测 D0 并采集 GSC
    depends_on: [input]
    acceptance:
      - target_site 必须属于 monitored_sites 且与 site_id 一致
      - 从业务日期减二日开始向前探测最近有数据的 D0
      - 返回 D0、D-1、近7日、前7日、近30日、前30日
      - 返回日、查询、页面、国家、设备五类维度
      - 无凭证或 API 失败时返回 UNAVAILABLE，不进入模拟路径
    config:
      tool: google_seo_monitor
      action: collect_gsc_module
      arguments:
        target_site: "{{ input.gsc_property }}"
        business_date: "{{ input.business_date }}"
        probe_days: 10
        row_limit: 25000

  - id: normalize
    type: tool_call
    title: 确定性标准化
    depends_on: [collect_gsc]
    acceptance:
      - 使用 control_tower.gsc 构造统一模块合同
      - position 统一命名为加权平均位置
      - 缺失窗口为 null，不借用旧日期、不补零
      - 单源风险明确标记为未经交叉验证
      - 非 REAL 数据不产生可评分指标点或 findings
    config:
      tool: google_seo_monitor
      action: normalize_gsc_module
      arguments:
        payload: "{{ collect_gsc }}"
        workflow_instance_id: "{{ runtime.instance_id }}"
        timeline_node_id: "{{ context.timeline_node_id }}"

  - id: archive
    type: tool_call
    title: 原始证据入库
    depends_on: [normalize]
    acceptance:
      - Asset Hub PUT 成功并获得 key
      - 标准化结果在持久化业务结果前入库
    config:
      tool: asset_hub
      action: put
      arguments:
        name: "gsc-{{ input.site_id }}-{{ input.business_date }}"
        kind: dataset
        content: "{{ normalize }}"
        content_type: application/json

  - id: persist
    type: tool_call
    title: 写入模块历史数据库
    depends_on: [normalize, archive]
    acceptance:
      - 按 site_id、module_id、business_date 定位唯一逻辑运行
      - 当日重试追加 attempt，不覆盖历史尝试
      - asset_id 必须来自 archive 节点
      - 写入后立即回读并核对 asset_id
    config:
      tool: google_seo_monitor
      action: persist_gsc_module
      arguments:
        payload:
          normalized: "{{ normalize }}"
          archived: "{{ archive }}"

  - id: output
    type: output
    title: GSC 模块完成
    depends_on: [persist]
    acceptance: []
    config:
      output_mode: result
