id: SchemaTemplates
kind: templates
description: >-
  Schema.org 结构化数据 JSON-LD 模版库 (jinja2 占位符)。Writer 智能体在整改
  内容时选择匹配模版渲染并注入 <head>。
version: 1
templates:
  article: |
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "{{ title }}",
      "description": "{{ description }}",
      "author": {"@type": "Person", "name": "{{ author_name }}", "url": "{{ author_url }}"},
      "datePublished": "{{ published_iso }}",
      "dateModified": "{{ modified_iso }}",
      "publisher": {"@type": "Organization", "name": "{{ org_name }}", "logo": {"@type": "ImageObject", "url": "{{ logo_url }}"}},
      "mainEntityOfPage": "{{ page_url }}"
    }
  faq_page: |
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {% for qa in faqs %}
        {"@type": "Question", "name": "{{ qa.q }}",
         "acceptedAnswer": {"@type": "Answer", "text": "{{ qa.a }}"}}{{ "," if not loop.last }}
        {% endfor %}
      ]
    }
  product: |
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "{{ name }}",
      "description": "{{ description }}",
      "brand": {"@type": "Brand", "name": "{{ brand }}"},
      "offers": {"@type": "Offer", "price": "{{ price }}", "priceCurrency": "{{ currency }}",
                 "availability": "https://schema.org/InStock", "url": "{{ page_url }}"}
    }
  organization: |
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "{{ org_name }}",
      "url": "{{ site_url }}",
      "logo": "{{ logo_url }}",
      "sameAs": {{ social_links | tojson }}
    }
  breadcrumb: |
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {% for crumb in crumbs %}
        {"@type": "ListItem", "position": {{ loop.index }}, "name": "{{ crumb.name }}", "item": "{{ crumb.url }}"}{{ "," if not loop.last }}
        {% endfor %}
      ]
    }
usage: "render(template, context) -> 注入 <script type=\"application/ld+json\">"
